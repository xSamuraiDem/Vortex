<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VortexPay</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #111);
    color: var(--tg-theme-text-color, #fff);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
  p { font-size: 15px; line-height: 1.5; opacity: 0.85; margin-bottom: 18px; }
  blockquote {
    border-left: 3px solid #5b8cff;
    padding: 10px 14px;
    margin: 14px 0;
    text-align: left;
    background: rgba(91, 140, 255, 0.08);
    border-radius: 6px;
  }
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    background: var(--tg-theme-button-color, #3b82f6);
    color: var(--tg-theme-button-text-color, #fff);
    cursor: pointer;
    margin-top: 10px;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .check {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    cursor: pointer;
    text-align: left;
    font-weight: 600;
  }
  .check input { width: 22px; height: 22px; }
  .codes {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 18px 0;
  }
  .codes input {
    width: 44px;
    height: 56px;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    border-radius: 10px;
    border: 2px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.06);
    color: inherit;
  }
  .codes input:focus { outline: none; border-color: #5b8cff; }
  .timer { font-size: 22px; font-weight: 800; color: #5b8cff; }
  .timer.expired { color: #ef4444; }
  .status { min-height: 22px; font-weight: 600; margin-top: 12px; }
  .ok { color: #22c55e; }
  .err { color: #ef4444; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="card">

  <div id="step-robot">
    <h1>Проверка</h1>
    <p>Подтвердите, что вы не робот.</p>
    <label class="check">
      <input type="checkbox" id="notRobot">
      <span>Я не робот</span>
    </label>
    <button class="btn" id="toCode" disabled>Продолжить</button>
  </div>

  <div id="step-code" class="hidden">
    <h1>Введите код</h1>
    <p>Код из <b>VortexPay</b> бота. Он действует <b>30 секунд</b>, после этого устареет.</p>
    <div class="timer" id="timer">30</div>
    <div class="codes" id="codes">
      <input maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input maxlength="1" inputmode="numeric" pattern="[0-9]">
    </div>
    <button class="btn" id="submit">Подтвердить</button>
    <div class="status" id="status"></div>
  </div>

</div>

<script>
  const API_URL = "https://your-domain.com/verify";   // HTTPS адрес вашего API
  const CODE_TTL = 30;

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const notRobot = document.getElementById("notRobot");
  const toCode = document.getElementById("toCode");
  const stepRobot = document.getElementById("step-robot");
  const stepCode = document.getElementById("step-code");
  const timerEl = document.getElementById("timer");
  const submitBtn = document.getElementById("submit");
  const statusEl = document.getElementById("status");
  const inputs = Array.from(document.querySelectorAll("#codes input"));

  let timeLeft = CODE_TTL;
  let timerId = null;

  notRobot.addEventListener("change", () => {
    toCode.disabled = !notRobot.checked;
  });

  toCode.addEventListener("click", () => {
    stepRobot.classList.add("hidden");
    stepCode.classList.remove("hidden");
    inputs[0].focus();
    startTimer();
  });

  function startTimer() {
    timeLeft = CODE_TTL;
    timerEl.textContent = timeLeft;
    timerEl.classList.remove("expired");
    submitBtn.disabled = false;
    clearInterval(timerId);
    timerId = setInterval(() => {
      timeLeft--;
      timerEl.textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timerId);
        expireCode();
      }
    }, 1000);
  }

  function expireCode() {
    timerEl.textContent = "0";
    timerEl.classList.add("expired");
    submitBtn.disabled = true;
    statusEl.className = "status err";
    statusEl.textContent = "Код устарел. Нажмите «Получить код» в боте.";
  }

  inputs.forEach((input, i) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "");
      if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !input.value && i > 0) inputs[i - 1].focus();
    });
    input.addEventListener("paste", (e) => {
      e.preventDefault();
      const digits = (e.clipboardData.getData("text") || "").replace(/\D/g, "");
      digits.slice(0, inputs.length).split("").forEach((d, j) => {
        inputs[j].value = d;
      });
      inputs[Math.min(digits.length, inputs.length) - 1]?.focus();
    });
  });

  submitBtn.addEventListener("click", async () => {
    const code = inputs.map(i => i.value).join("");
    if (code.length !== 6) {
      statusEl.className = "status err";
      statusEl.textContent = "Введите все 6 цифр.";
      return;
    }
    if (timeLeft <= 0) {
      expireCode();
      return;
    }

    submitBtn.disabled = true;
    statusEl.className = "status";
    statusEl.textContent = "Проверка...";

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          init_data: tg ? tg.initData : "",
          code: code
        })
      });
      const data = await res.json();

      if (data.ok) {
        clearInterval(timerId);
        statusEl.className = "status ok";
        statusEl.textContent = "Вход выполнен!";
        if (tg) setTimeout(() => tg.close(), 1200);
      } else {
        statusEl.className = "status err";
        statusEl.textContent = data.error || "Ошибка проверки";
        submitBtn.disabled = false;
      }
    } catch (e) {
      statusEl.className = "status err";
      statusEl.textContent = "Нет связи с сервером";
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
