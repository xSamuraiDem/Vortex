<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VortexPay</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #7a7a7a);
    --accent: var(--tg-theme-button-color, #2ea661);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --danger: #e5484d;
    --ok: #2ea661;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 380px; text-align: center; }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), #1f8a4c);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-text); font-size: 26px; font-weight: 800;
    box-shadow: 0 8px 22px rgba(46, 166, 97, 0.35);
  }
  h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
  .sub { color: var(--hint); font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
  .card { background: var(--card); border-radius: 18px; padding: 22px 18px; margin-bottom: 14px; }
  .step { display: none; animation: fade 0.3s ease; }
  .step.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .robot {
    display: flex; align-items: center; gap: 14px; cursor: pointer; user-select: none;
    padding: 14px; border-radius: 14px; background: var(--bg); text-align: left;
  }
  .robot input { display: none; }
  .box {
    width: 28px; height: 28px; flex-shrink: 0; border: 2px solid var(--hint); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .robot.checked .box { background: var(--ok); border-color: var(--ok); }
  .robot.checked .box::after {
    content: ""; width: 7px; height: 13px; border: solid #fff; border-width: 0 3px 3px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .robot-label { font-weight: 600; font-size: 15px; }
  .robot-note { font-size: 12px; color: var(--hint); margin-top: 2px; }
  .spinner {
    width: 22px; height: 22px; margin-left: auto; border: 3px solid var(--hint);
    border-top-color: transparent; border-radius: 50%; display: none; animation: spin 0.7s linear infinite;
  }
  .robot.loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .code-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .code-hint { font-size: 13px; color: var(--hint); margin-bottom: 18px; line-height: 1.5; }

  .otp { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
  .otp input {
    width: 44px; height: 54px; border: 2px solid transparent; border-radius: 12px;
    background: var(--bg); color: var(--text); font-size: 24px; font-weight: 700;
    text-align: center; outline: none; transition: border-color 0.2s, transform 0.15s;
    caret-color: var(--accent);
  }
  .otp input:focus { border-color: var(--accent); transform: translateY(-2px); }
  .otp input.filled { border-color: var(--accent); }
  .otp input.error { border-color: var(--danger); color: var(--danger); }
  .otp.shake { animation: shake 0.4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .timer-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: var(--hint); margin-bottom: 8px;
  }
  .timer-value { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--bg); border-radius: 6px; overflow: hidden; margin-bottom: 18px; }
  .bar-fill { height: 100%; width: 100%; background: var(--accent); transition: width 0.25s linear, background 0.3s; }
  .bar-fill.warn { background: var(--danger); }

  .btn {
    width: 100%; padding: 15px; border: none; border-radius: 14px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    background: var(--accent); color: var(--accent-text); transition: opacity 0.2s, transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--accent); margin-top: 10px; font-size: 14px; }

  .status { min-height: 20px; font-size: 13px; margin-top: 14px; font-weight: 600; }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--ok); }

  .success-icon {
    width: 70px; height: 70px; margin: 6px auto 16px; border-radius: 50%;
    background: var(--ok); display: flex; align-items: center; justify-content: center;
    animation: pop 0.4s ease;
  }
  .success-icon::after {
    content: ""; width: 20px; height: 36px; border: solid #fff; border-width: 0 5px 5px 0;
    transform: rotate(45deg) translate(-3px, -3px);
  }
  @keyframes pop { 0% { transform: scale(0.4); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .footer { font-size: 11px; color: var(--hint); margin-top: 18px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">V</div>
  <h1>VortexPay</h1>
  <p class="sub">Быстрый и безопасный вход в сервис</p>

  <!-- Шаг 1: проверка на робота -->
  <div class="card step active" id="step-robot">
    <label class="robot" id="robotBox">
      <input type="checkbox" id="robotCheck">
      <span class="box"></span>
      <span>
        <span class="robot-label">Я не робот</span>
        <div class="robot-note">Подтвердите, что вы человек</div>
      </span>
      <span class="spinner"></span>
    </label>
  </div>

  <!-- Шаг 2: запрос кода -->
  <div class="card step" id="step-request">
    <div class="code-title">Получите код</div>
    <div class="code-hint">Код придёт в чат с ботом. Он действует 30 секунд.</div>
    <button class="btn" id="requestBtn">Получить код</button>
    <div class="status" id="requestStatus"></div>
  </div>

  <!-- Шаг 3: ввод кода -->
  <div class="card step" id="step-code">
    <div class="code-title">Введите код из бота</div>
    <div class="code-hint">Введите 6 цифр, пока код не устарел.</div>

    <div class="timer-row">
      <span>Код действует</span>
      <span class="timer-value" id="timerText">30 сек</span>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>

    <div class="otp" id="otp">
      <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code">
      <input type="text" inputmode="numeric" maxlength="1">
      <input type="text" inputmode="numeric" maxlength="1">
      <input type="text" inputmode="numeric" maxlength="1">
      <input type="text" inputmode="numeric" maxlength="1">
      <input type="text" inputmode="numeric" maxlength="1">
    </div>

    <button class="btn" id="verifyBtn" disabled>Войти</button>
    <button class="btn ghost" id="resendBtn" style="display:none">Получить новый код</button>
    <div class="status" id="codeStatus"></div>
  </div>

  <!-- Шаг 4: успех -->
  <div class="card step" id="step-done">
    <div class="success-icon"></div>
    <div class="code-title">Вход выполнен</div>
    <div class="code-hint">Добро пожаловать в VortexPay.</div>
  </div>

  <div class="footer">VortexPay · Защищённый вход</div>
</div>

<script>
  const FIREBASE_DB = "https://tetete-d31c8-default-rtdb.firebaseio.com";
  const CODE_TTL = 30;

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  const uid = user ? String(user.id) : null;

  const $ = (id) => document.getElementById(id);
  const inputs = [...document.querySelectorAll("#otp input")];
  let expiresAt = 0;
  let timerId = null;
  let pollId = null;

  function show(stepId) {
    document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
    $(stepId).classList.add("active");
  }

  function setStatus(el, text, type) {
    el.textContent = text;
    el.className = "status" + (type ? " " + type : "");
  }

  async function fbFetch(path, options) {
    const res = await fetch(`${FIREBASE_DB}/${path}.json`, options);
    if (!res.ok) throw new Error("Ошибка сервера: " + res.status);
    return res.json();
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  // Шаг 1: проверка на робота
  $("robotCheck").addEventListener("change", async (e) => {
    const box = $("robotBox");
    if (!e.target.checked) return;
    box.classList.add("loading");
    await sleep(900);
    box.classList.remove("loading");
    box.classList.add("checked");
    await sleep(300);
    show("step-request");
  });

  // Шаг 2: запрос кода через Firebase
  $("requestBtn").addEventListener("click", async () => {
    const btn = $("requestBtn");
    const status = $("requestStatus");
    if (!uid) {
      setStatus(status, "Откройте приложение кнопкой Запустить в боте", "error");
      return;
    }
    btn.disabled = true;
    setStatus(status, "Запрашиваем код в боте...", "");
    try {
      await fbFetch(`codes/${uid}`, { method: "DELETE" });
      await fbFetch(`results/${uid}`, { method: "DELETE" });
      await fbFetch(`requests/${uid}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Date.now())
      });

      // Ждём, пока бот создаст код и запишет время истечения
      const deadline = Date.now() + 15000;
      let data = null;
      while (Date.now() < deadline) {
        data = await fbFetch(`codes/${uid}`);
        if (data && data.expires) break;
        await sleep(1000);
      }
      if (!data || !data.expires) {
        throw new Error("Бот не ответил. Проверьте, что он запущен.");
      }
      expiresAt = data.expires;
      setStatus(status, "", "");
      startTimer();
      show("step-code");
      inputs[0].focus();
    } catch (err) {
      setStatus(status, err.message || "Не удалось получить код", "error");
    } finally {
      btn.disabled = false;
    }
  });

  // Таймер 30 секунд
  function startTimer() {
    clearInterval(timerId);
    const tick = () => {
      const left = Math.max(0, Math.ceil((expiresAt - Date.now()) / 1000));
      const pct = Math.max(0, Math.min(100, ((expiresAt - Date.now()) / (CODE_TTL * 1000)) * 100));
      $("timerText").textContent = left + " сек";
      $("barFill").style.width = pct + "%";
      $("barFill").classList.toggle("warn", left <= 10);
      if (left <= 0) {
        clearInterval(timerId);
        expireCode();
      }
    };
    tick();
    timerId = setInterval(tick, 250);
  }

  function expireCode() {
    $("verifyBtn").disabled = true;
    $("resendBtn").style.display = "block";
    setStatus($("codeStatus"), "Код устарел. Запросите новый.", "error");
  }

  // Ввод цифр: автопереход, удаление, вставка из буфера
  inputs.forEach((input, i) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "").slice(0, 1);
      input.classList.toggle("filled", !!input.value);
      if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
      updateVerifyBtn();
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !input.value && i > 0) {
        inputs[i - 1].value = "";
        inputs[i - 1].classList.remove("filled");
        inputs[i - 1].focus();
        updateVerifyBtn();
      }
    });
    input.addEventListener("paste", (e) => {
      e.preventDefault();
      const digits = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
      digits.split("").forEach((d, j) => {
        if (inputs[j]) {
          inputs[j].value = d;
          inputs[j].classList.add("filled");
        }
      });
      const next = Math.min(digits.length, inputs.length - 1);
      inputs[next].focus();
      updateVerifyBtn();
    });
  });

  function getCode() { return inputs.map(i => i.value).join(""); }

  function updateVerifyBtn() {
    $("verifyBtn").disabled = getCode().length !== 6;
  }

  function shakeCode() {
    const otp = $("otp");
    otp.classList.remove("shake");
    void otp.offsetWidth;
    otp.classList.add("shake");
    inputs.forEach(i => i.classList.add("error"));
    setTimeout(() => inputs.forEach(i => i.classList.remove("error")), 900);
  }

  // Шаг 3: проверка кода через Firebase
  $("verifyBtn").addEventListener("click", async () => {
    const btn = $("verifyBtn");
    const status = $("codeStatus");
    if (Date.now() > expiresAt) { expireCode(); return; }
    btn.disabled = true;
    setStatus(status, "Проверяем код...", "");
    try {
      await fbFetch(`results/${uid}`, { method: "DELETE" });
      await fbFetch(`checks/${uid}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: getCode(), ts: Date.now() })
      });

      const deadline = Date.now() + 10000;
      let result = null;
      while (Date.now() < deadline) {
        result = await fbFetch(`results/${uid}`);
        if (result) break;
        await sleep(800);
      }
      if (!result) throw new Error("Сервер не ответил. Попробуйте ещё раз.");

      if (result.ok) {
        clearInterval(timerId);
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        show("step-done");
      } else {
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
        shakeCode();
        setStatus(status, result.error || "Неверный код", "error");
        btn.disabled = false;
      }
      await fbFetch(`results/${uid}`, { method: "DELETE" });
    } catch (err) {
      setStatus(status, err.message || "Ошибка связи", "error");
      btn.disabled = false;
    }
  });

  // Новый код
  $("resendBtn").addEventListener("click", () => {
    $("resendBtn").style.display = "none";
    inputs.forEach(i => { i.value = ""; i.classList.remove("filled"); });
    setStatus($("codeStatus"), "", "");
    show("step-request");
  });

  if (!uid) {
    setStatus($("requestStatus"), "Откройте приложение кнопкой Запустить в боте", "error");
  }
</script>
</body>
</html>
