<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VortexPay</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #111827);
    color: var(--tg-theme-text-color, #f9fafb);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--tg-theme-secondary-bg-color, #1f2937);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
  }
  h1 { font-size: 22px; margin-bottom: 8px; }
  .sub { font-size: 14px; opacity: 0.8; margin-bottom: 20px; }
  blockquote {
    border-left: 4px solid #22c55e;
    background: rgba(34, 197, 94, 0.1);
    padding: 10px 14px;
    border-radius: 8px;
    text-align: left;
    font-size: 14px;
    margin-bottom: 20px;
  }
  label.check {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    font-size: 15px;
    margin-bottom: 20px;
    cursor: pointer;
  }
  input[type="checkbox"] { width: 20px; height: 20px; }
  input[type="text"] {
    width: 100%;
    padding: 14px;
    font-size: 24px;
    letter-spacing: 8px;
    text-align: center;
    border: 2px solid #374151;
    border-radius: 12px;
    background: #111827;
    color: #f9fafb;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    background: #22c55e;
    color: #fff;
    cursor: pointer;
  }
  button:disabled { background: #4b5563; cursor: not-allowed; }
  .timer { font-size: 14px; margin-top: 12px; opacity: 0.9; }
  .timer.expired { color: #ef4444; font-weight: bold; }
  .msg { margin-top: 14px; font-size: 14px; min-height: 20px; }
  .msg.ok { color: #22c55e; font-weight: bold; }
  .msg.err { color: #ef4444; font-weight: bold; }
</style>
</head>
<body>
<div class="card">
  <h1><b>VortexPay</b></h1>
  <p class="sub">Подтвердите вход</p>

  <blockquote>
    <b>Шаг 1.</b> Подтвердите, что вы не робот.<br>
    <b>Шаг 2.</b> Введите <b>6-значный код</b> из чата с ботом.<br>
    Код действует <b>30 секунд</b>.
  </blockquote>

  <label class="check">
    <input type="checkbox" id="human">
    <span>Я не робот</span>
  </label>

  <input type="text" id="code" maxlength="6" inputmode="numeric" placeholder="000000" disabled>
  <button id="submit" disabled>Подтвердить</button>
  <div class="timer" id="timer"></div>
  <div class="msg" id="msg"></div>
</div>

<script>
  const API_URL = "https://your-domain.com/verify";
  const CODE_TTL = 30;

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const human = document.getElementById("human");
  const codeInput = document.getElementById("code");
  const submitBtn = document.getElementById("submit");
  const timerEl = document.getElementById("timer");
  const msgEl = document.getElementById("msg");

  let deadline = null;
  let timerId = null;

  function setMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className = "msg " + (type || "");
  }

  function startTimer() {
    deadline = Date.now() + CODE_TTL * 1000;
    clearInterval(timerId);
    timerId = setInterval(() => {
      const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      if (left === 0) {
        clearInterval(timerId);
        timerEl.textContent = "Код устарел. Получите новый в боте.";
        timerEl.className = "timer expired";
        codeInput.value = "";
        codeInput.disabled = true;
        submitBtn.disabled = true;
      } else {
        timerEl.textContent = "Осталось: " + left + " сек.";
        timerEl.className = "timer";
      }
    }, 250);
  }

  human.addEventListener("change", () => {
    const on = human.checked;
    codeInput.disabled = !on;
    submitBtn.disabled = !on;
    if (on) {
      setMsg("", "");
      codeInput.focus();
      startTimer();
    } else {
      clearInterval(timerId);
      timerEl.textContent = "";
    }
  });

  codeInput.addEventListener("input", () => {
    codeInput.value = codeInput.value.replace(/\D/g, "").slice(0, 6);
  });

  submitBtn.addEventListener("click", async () => {
    const code = codeInput.value.trim();
    if (!/^\d{6}$/.test(code)) {
      setMsg("Введите 6 цифр.", "err");
      return;
    }
    if (!deadline || Date.now() > deadline) {
      setMsg("Код устарел. Получите новый в боте.", "err");
      return;
    }
    submitBtn.disabled = true;
    setMsg("Проверка...", "");
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          init_data: tg ? tg.initData : "",
          code: code
        })
      });
      const data = await res.json();
      if (data.ok) {
        clearInterval(timerId);
        setMsg("Вход подтверждён!", "ok");
        timerEl.textContent = "";
        codeInput.disabled = true;
        if (tg) setTimeout(() => tg.close(), 1200);
      } else {
        setMsg(data.error || "Ошибка проверки", "err");
        submitBtn.disabled = false;
      }
    } catch (e) {
      setMsg("Нет связи с сервером", "err");
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
